name: tests

# Runs pytest on every PR. Distinct from release.yml, which is
# workflow_dispatch-driven and produces the OS-specific binaries / release zip.
#
# Deliberately `pull_request:` only, not also `push:` — every commit on an
# open PR already fires `pull_request` (opened/synchronize/reopened), so a
# branch-scoped `push:` trigger alongside it doubled every run (two parallel
# "tests" workflow runs per commit, `event: pull_request` and `event: push`,
# racing each other for no benefit). The quality gate is "every PR runs the
# full suite" — this still guarantees that; it just stops running it twice.
#
# OS_TARGETS default: [windows, linux]. If the plugin is genuinely Windows-only
# (e.g. depends on Win32 / COM, like agent-vdesktop), drop ubuntu-22.04 from
# the matrix and switch release.yml to a single-OS pipeline — see AGENTS.md
# "OS_TARGETS" for the Windows-only override.
on:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    # TEMPORARY: dropped from 10 to diagnose this PR's hang — every CI run on
    # this branch got killed at ~10m (reported as `cancelled`, not
    # `failure`/`timed_out`, which is why it looked like external interference).
    # A known-good run finishes the whole suite in ~99s, so something hangs
    # intermittently past that; a short timeout should surface it as a job
    # failure with a log pointing at the stuck step instead of silently
    # eating the full 10-minute budget. Revert to 10 once the hang is found.
    timeout-minutes: 3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install plugin + test deps
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run pytest
        shell: bash
        run: python -m pytest

  # Frozen-binary check: builds the PyInstaller binary and smoke-tests it with a
  # real MCP initialize + tools/list (fails if lib_python_harness is not bundled).
  build:
    strategy:
      fail-fast: false
      matrix:
        # include: form (not os: [...] + extra include) so the 5.1 row is its
        # own job instead of being merged into the windows-latest combination.
        # `launcher` is the PowerShell host that runs build.ps1: powershell.exe
        # is Windows PowerShell 5.1, pwsh is PowerShell 7 / Linux pwsh.
        include:
          - os: windows-latest
            launcher: pwsh
          - os: windows-latest
            launcher: powershell.exe
          - os: ubuntu-22.04
            launcher: pwsh
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and smoke-test the binary
        shell: pwsh
        run: ${{ matrix.launcher }} -File scripts/build.ps1

      - name: Run the wait tests against the frozen binary
        shell: pwsh
        run: |
          python -m pip install -e ".[test]"
          $bin = if ($IsWindows) { "bin/harness.exe" } else { "bin/harness" }
          $env:HARNESS_BIN = (Resolve-Path $bin).Path
          python -m pytest tests/test_wait_run.py
