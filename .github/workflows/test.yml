name: tests

# Runs pytest on every push to any branch and on every PR. Distinct from
# release.yml, which is workflow_dispatch-driven and produces the OS-specific
# binaries / release zip.
#
# OS_TARGETS default: [windows, linux]. If the plugin is genuinely Windows-only
# (e.g. depends on Win32 / COM, like agent-vdesktop), drop ubuntu-22.04 from
# the matrix and switch release.yml to a single-OS pipeline — see AGENTS.md
# "OS_TARGETS" for the Windows-only override.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install plugin + test deps
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run pytest
        shell: bash
        run: python -m pytest

  # Frozen-binary check: builds the PyInstaller binary and smoke-tests it with a
  # real MCP initialize + tools/list (fails if lib_python_harness is not bundled).
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and smoke-test the binary
        shell: pwsh
        run: pwsh -File scripts/build.ps1

      - name: Run the wait-run tests against the frozen binary
        shell: pwsh
        run: |
          python -m pip install -e ".[test]"
          $bin = if ($IsWindows) { "bin/harness.exe" } else { "bin/harness" }
          $env:HARNESS_BIN = (Resolve-Path $bin).Path
          python -m pytest tests/test_wait_run.py
