[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "harness_plugin"
version = "0.0.0"
description = "Provider-independent subagent system for coding agents - replaces the host's built-in subagent tool calls."
requires-python = ">=3.11"
authors = [{ name = "Arne von Appen" }]
dependencies = [
  "mcp>=1.2,<2",
  "lib-python-harness @ git+https://github.com/Seretos/lib-python-harness@v0.0.4",
]

[project.optional-dependencies]
build = [
  "pyinstaller>=6.10",
]
test = [
  "pytest>=8",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers -m 'not live'"
markers = [
  "live: needs the real `claude` CLI; deselected by default, run with `python -m pytest -m live`",
]
